<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Exam Grader</title>
  <meta name="description" content="Offline paper exam grading: print exams with bubbles, scan with the camera, grade, and export marked PDFs and gradebooks.">
  <meta name="theme-color" content="#00553a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>Exam Grader</span></div>
    <select id="examPick" aria-label="Current exam"></select>
  </header>
  <nav id="nav" aria-label="Sections"></nav>
  <main id="view"></main>
  <div id="toasts"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>
  <script src="js/util.js"></script>
  <script src="js/db.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/cv.js"></script>
  <script src="js/annot.js"></script>
  <script src="js/grade.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
